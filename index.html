<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相片展示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #2a2a2a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            width: 100%;
            position: relative;
            background-color: #000;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .content {
            padding: 24px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f3f3f3;
        }

        .description {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.6;
        }

        .tag-container {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #3a3a3a;
            color: #ddd;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="index.html.jpg" alt="照片展示">
        </div>
        <div class="content">
            <h2 class="title">時尚隨拍</h2>
            <p class="description">精彩瞬間紀錄與風格展示。</p>
            <div class="tag-container">
                <span class="tag">#Life</span>
                <span class="tag">#Style</span>
                <span class="tag">#Photo</span>
            </div>
        </div>
    </div>

</body>
</html>
