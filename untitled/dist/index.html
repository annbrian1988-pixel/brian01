<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情人節專屬 - 手工洗車兌換券</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px 20px;
      text-align: center;
      border: 2px solid #f8bbd0;
    }
    h1 {
      color: #d81b60;
      font-size: 22px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 15px;
      color: #c2185b;
      font-weight: bold;
      text-align: left;
      margin: 15px 0 8px 4px;
      padding-left: 8px;
      border-left: 4px solid #f48fb1;
    }
    /* 服務項目選單 (純展示) */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .service-item {
      background: #fff5f8;
      border: 1px solid #f8bbd0;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      color: #444;
      font-weight: 500;
    }
    /* 5 次蓋章區 */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .stamp-box {
      background: #fafafa;
      border: 2px dashed #f48fb1;
      border-radius: 12px;
      padding: 15px 5px;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .stamp-box:active { transform: scale(0.95); }
    .stamp-count {
      font-size: 14px;
      color: #888;
      font-weight: bold;
    }
    /* 印章效果 */
    .stamp {
      display: none;
      position: absolute;
      width: 65px;
      height: 65px;
      border: 3px solid #e91e63;
      border-radius: 50%;
      color: #e91e63;
      font-size: 14px;
      font-weight: bold;
      line-height: 59px;
      text-align: center;
      transform: rotate(-15deg);
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 5px rgba(233, 30, 99, 0.3);
      pointer-events: none;
    }
    .stamp::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      border: 1px dashed #e91e63;
      border-radius: 50%;
    }
    .stamp-box.redeemed .stamp { display: block; }
    .stamp-box.redeemed {
      background: #f8bbd0;
      border-style: solid;
      border-color: #e91e63;
    }
    .stamp-box.redeemed .stamp-count { opacity: 0.3; }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="card-container">
  <h1>❤️ 情人節專屬手工洗車券 ❤️</h1>
  <p class="subtitle">每次洗車完成點擊下方方格即可蓋章兌換</p>

  <!-- 服務項目列表 -->
  <div class="section-title">包含服務項目</div>
  <div class="service-grid">
    <div class="service-item">1. 高壓沖洗</div>
    <div class="service-item">2. 泡沫泡泡浴</div>
    <div class="service-item">3. 車輪清潔</div>
    <div class="service-item">4. 柏油去除</div>
    <div class="service-item">5. 玻璃除油墨</div>
    <div class="service-item">6. 內裝吸塵</div>
    <div class="service-item">7. 輪胎亮光</div>
    <div class="service-item">8. 車內香氛</div>
    <div class="service-item">9. 打蠟防護</div>
    <div class="service-item">10. 交車</div>
  </div>

  <!-- 5 次集點區 -->
  <div class="section-title">兌換紀錄（共 5 次）</div>
  <div class="stamp-grid" id="stampGrid"></div>

  <p class="footer-note">憑此卡可享專屬洗車服務 · 兌換進度自動儲存</p>
</div>

<script>
  const totalCount = 5;
  const grid = document.getElementById('stampGrid');
  let savedState = JSON.parse(localStorage.getItem('carWashStampCoupon')) || Array(totalCount).fill(false);

  for (let i = 0; i < totalCount; i++) {
    const box = document.createElement('div');
    box.className = 'stamp-box' + (savedState[i] ? ' redeemed' : '');
    
    box.innerHTML = `
      <div class="stamp-count">第 ${i + 1} 次</div>
      <div class="stamp">已兌換</div>
    `;

    box.addEventListener('click', () => {
      savedState[i] = !savedState[i];
      box.classList.toggle('redeemed');
      localStorage.setItem('carWashStampCoupon', JSON.stringify(savedState));
    });

    grid.appendChild(box);
  }
</script>

</body>
</html>
